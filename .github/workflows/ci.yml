name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel earlier runs on the same branch/PR — only the latest matters.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint • Test • Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Build packages
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Build apps
        run: pnpm build:apps

      - name: Bundle size budget
        run: pnpm size
