name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel earlier runs on the same branch/PR — only the latest matters.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint • Test • Build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 22 & 24 are LTS lines; 26 is the current release (LTS Oct 2026),
        # tested for forward compatibility. engines requires Node >=22.
        node: [22, 24, 26]

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      # Build first: adapters resolve @anil-labs/core through its built dist
      # types, so typecheck and tests need the packages compiled.
      - name: Build packages
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # Validates package.json exports/types resolution for every publishable
      # package (publint) and TypeScript resolution across module systems (attw).
      - name: Package checks (publint + arethetypeswrong)
        run: |
          for d in core react vue svelte solid web-component styles; do
            npx --yes publint "packages/$d"
          done
          for d in core react vue svelte solid web-component; do
            npx --yes @arethetypeswrong/cli --pack "packages/$d" --profile node16
          done

      # Smoke-test that every publishable JS package loads in plain Node,
      # both require() and import — catches SSR-hostile module-scope DOM access.
      - name: Node import smoke test
        run: |
          for d in core react vue svelte solid web-component; do
            node -e "require('./packages/$d/dist/index.cjs')"
            node --input-type=module -e "import('./packages/$d/dist/index.js').then(() => {})"
          done

      - name: Build examples
        run: pnpm build:examples

      - name: Bundle size budget
        run: pnpm size
